{% load image_delivery_tags %}

<section class="section comparison">
  <div class="container">
    <header class="section__header">
      {% if self.accent_text %}
      <span class="section__eyebrow">{{ self.accent_text }}</span>
      {% endif %}
      <h2 class="section__heading">{{ self.title }}</h2>
      {% if self.description %}
      <p class="section__intro">{{ self.description }}</p>
      {% endif %}
    </header>

    <div class="comparison__images">
      <figure>
        {% responsive_picture self.image_before "card_landscape" alt="Before image" loading="lazy" %}
      </figure>
      <figure>
        {% responsive_picture self.image_after "card_landscape" alt="After image" loading="lazy" %}
      </figure>
    </div>
  </div>
</section>
