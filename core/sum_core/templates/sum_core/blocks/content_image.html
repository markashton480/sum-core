{% load image_delivery_tags %}
<div class="content-block-wrapper">
  <div
    class="container{% if not self.full_width %} container--narrow{% endif %}"
  >
    <figure class="image-block observe-me">
      <div class="image-wrapper">
        {% responsive_picture self.image "content_inline" alt=self.alt_text %}
      </div>
      {% if self.caption %}
      <figcaption class="image-caption text-sm">
        {{ self.caption }}
      </figcaption>
      {% endif %}
    </figure>
  </div>
</div>
